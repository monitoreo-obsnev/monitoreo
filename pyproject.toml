[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoreo"
version = "0.3.7"
description = "MonitorEO-OBSNEV: open monitoring tool of Essential Biodiversity Variables based on satellite sensors (University of Granada), for Python, QGIS, R and language models (MCP)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "OBSNEV - Universidad de Granada" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "earthengine-api>=0.1.380",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
plot = ["matplotlib"]
test = ["pytest"]
all = ["mcp>=1.10", "matplotlib", "pytest"]

[project.scripts]
monitoreo = "monitoreo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitoreo = ["catalog.json", "logos/*", "viewer/*.html", "viewer/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]  # the tests use this clone, whatever version of monitoreo is installed
markers = ["ee: needs Earth Engine (set EE_PROJECT)"]
