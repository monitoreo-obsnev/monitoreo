# Installers of the assistant for managers: installer/macos/instalar.sh and installer/windows/instalar.bat, zipped
# as "Install the MonitorEO assistant.command" (with its execute permission) and ".bat", attached to the GitHub
# release with fixed names, so that the wiki links them as releases/latest/download/asistente-monitoreo-macos.zip and
# ...-windows.zip (the wiki also gives the one-line commands that download them with curl, without the block of the
# files downloaded with the browser):
# - when a release is published or a tag v* is pushed (like the workflow of the QGIS plugin);
# - by hand (Actions > Assistant installers > Run workflow) with the tag of a release that already exists; without a
#   tag, it leaves the zips as an artifact of the run.
# The installers download the environment.yml of main, so they work for any release.
name: Assistant installers

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach the zips to (empty: only an artifact)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: installers-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the installers
        run: |
          bash -n installer/macos/instalar.sh
          file installer/windows/instalar.bat | grep -q CRLF
      - name: Make the zips
        run: |
          mkdir -p dist build/macos build/windows
          install -m 755 installer/macos/instalar.sh "build/macos/Install the MonitorEO assistant.command"
          cp installer/windows/instalar.bat "build/windows/Install the MonitorEO assistant.bat"
          (cd build/macos && zip -X ../../dist/asistente-monitoreo-macos.zip "Install the MonitorEO assistant.command")
          (cd build/windows && zip -X ../../dist/asistente-monitoreo-windows.zip "Install the MonitorEO assistant.bat")
          unzip -Z dist/asistente-monitoreo-macos.zip | grep -q -- '-rwx'
      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: installers
          path: dist/*.zip
      - name: Attach the zips to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # with a new tag, the workflow of the QGIS plugin may be creating the release at the same time
          for i in $(seq 18); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MonitorEO $TAG" --notes "" || true
          gh release upload "$TAG" dist/asistente-monitoreo-macos.zip dist/asistente-monitoreo-windows.zip --clobber
