# QGIS plugin: makes the zip of the plugin with qgis/build_plugin.py (with monitoreo and earthengine-api inside) and
# attaches it to the GitHub release:
# - when a release is published on the web (Releases > Draft a new release > Publish release);
# - when a tag v* is pushed (e.g. v0.2.0 from GitHub Desktop), creating the release if it does not exist;
# - by hand (Actions > QGIS plugin > Run workflow) with the tag of a release that already exists; without a tag, it
#   leaves the zip as an artifact of the run.
# The notes of a release it creates (or that has none) are its entries of the changelog of README.md
# (.github/changelog.py notes <tag>), with how to install the zip.
# With a tag, it also uploads the zip to the official repository (plugins.qgis.org/plugins/monitoreo_qgis) if that
# version is not there yet and the repository has the secret QGIS_PLUGINS_TOKEN (the token of the plugin there).
name: QGIS plugin

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to attach the zip to (empty: only an artifact)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: qgis-plugin-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  QGIS_PLUGINS: ${{ secrets.QGIS_PLUGINS_TOKEN != '' }}  # 'true' if the secret exists (without exposing the token)

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the security scanners of plugins.qgis.org
        run: pip install bandit detect-secrets
      - name: Make the zip of the plugin (and scan it like plugins.qgis.org)
        run: python qgis/build_plugin.py
      - name: Check that the version of the plugin is that of the tag
        if: env.TAG != ''
        run: |
          python - <<'EOF'
          import os, re, sys
          tag = os.environ['TAG']
          ver = re.search(r'^version=(.+)$', open('qgis/monitoreo_qgis/metadata.txt').read(), re.M).group(1).strip()
          def parts(v):  # 0.1 = v0.1.0
              p = v.strip().lstrip('vV').split('.')
              while len(p) > 1 and p[-1] == '0':
                  p.pop()
              return p
          if parts(tag) != parts(ver):
              sys.exit(f'The tag {tag} does not match version={ver} of qgis/monitoreo_qgis/metadata.txt')
          print(f'Tag {tag} = version {ver} of the plugin')
          EOF
      - name: Attach the zip to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/monitoreo_qgis-*.zip)
          notes="QGIS plugin: download $(basename "$zip") and install it in QGIS with Plugins > Manage and Install Plugins > Install from ZIP."
          # what the release brings, from the changelog of README.md (none in the tags before it had one)
          changes=$(python .github/changelog.py notes "$TAG" 2>/dev/null || true)
          if [ -n "$changes" ]; then
            notes="$changes

          $notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes "$notes"
            fi
          else
            gh release create "$TAG" "$zip" --title "MonitorEO $TAG" --notes "$notes"
          fi
      - name: Upload the zip to plugins.qgis.org
        if: env.TAG != '' && env.QGIS_PLUGINS == 'true'
        env:
          QGIS_PLUGINS_TOKEN: ${{ secrets.QGIS_PLUGINS_TOKEN }}
        run: |
          zip=$(ls dist/monitoreo_qgis-*.zip)
          ver=$(sed -n 's/^version=//p' qgis/monitoreo_qgis/metadata.txt | tr -d '[:space:]')
          site=https://plugins.qgis.org/plugins
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$site/monitoreo_qgis/version/$ver/")" = 200 ]; then
            echo "Version $ver is already in plugins.qgis.org"
          else
            # the upload API with a token (plugins/urls.py of github.com/qgis/QGIS-Plugins-Website)
            curl -sS --fail-with-body -X POST -H "Authorization: Bearer $QGIS_PLUGINS_TOKEN" -F "package=@$zip" \
              "$site/api/monitoreo_qgis/version/add/"
            echo "Version $ver uploaded to plugins.qgis.org: it goes through the security scan and the approval before it is published"
          fi
      - name: Keep the zip as an artifact (manual run without a tag)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: monitoreo_qgis
          path: dist/monitoreo_qgis-*.zip
