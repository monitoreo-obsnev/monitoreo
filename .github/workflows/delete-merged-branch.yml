# Delete merged branch: when a pull request is merged, deletes its branch from this repository, so that merged
# branches never pile up (team decision, 2026-11-09). It does what the setting "Automatically delete head branches"
# (Settings > General > Pull Requests, only for administrators) does; with both on, this one finds the branch already
# gone and does nothing. It never deletes main, nor the branches of forks (they are not in this repository).
# Locally, `git config fetch.prune true` makes `git fetch` forget the deleted branches, and the skill monitoreo-change
# deletes the local branch after the merge.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --silent 2>/dev/null; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
            echo "Deleted the branch ${BRANCH}"
          else
            echo "The branch ${BRANCH} is already deleted"
          fi
