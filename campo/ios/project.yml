# The iPhone app of MonitorEO Campo, generated with XcodeGen (`xcodegen generate` in this folder, see
# .github/workflows/ios.yml). Its interface is the same web page as the APK (app/src/main/assets/www), copied as is
# into the app; only the native bridge (ios/Campo/*.swift) is of iOS.
name: Campo
options:
  bundleIdPrefix: es.ugr.monitoreo
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"   # the workflow sets it from versionName of app/build.gradle
    CURRENT_PROJECT_VERSION: "8" # and this from versionCode
targets:
  Campo:
    type: application
    platform: iOS
    sources:
      - path: Campo
      - path: ../app/src/main/assets/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Campo
        PRODUCT_BUNDLE_IDENTIFIER: es.ugr.monitoreo.campo
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
