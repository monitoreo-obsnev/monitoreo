# Python environment of MonitorEO: the package monitoreo of GitHub (which `monitoreo mcp` keeps at its last version),
# with the MCP server, the assistant for managers (and its window), the charts and the tests.
# Create it with Miniforge (only conda-forge, without the terms of use of the defaults channel of Anaconda):
#   conda env create -f environment.yml
#   conda activate monitoreo
#   earthengine authenticate
name: monitoreo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - earthengine-api>=1.0
  - numpy
  - pyyaml             # recipes of variables (monitoreo download)
  - gdal>=3.6          # reading of vector files and writing of GeoTIFFs (optional for time series)
  - matplotlib-base    # charts of the time series (without Qt, which they do not use: 0.1 GB less on Windows)
  - mcp>=1.10          # MCP server
  - starlette          # assistant for managers (monitoreo assistant)
  - uvicorn
  - pytest
  - pip
  - pip:
      - pywebview          # the window of the assistant (not in conda-forge for macOS)
      - monitoreo[assistant] @ https://github.com/monitoreo-obsnev/monitoreo/archive/refs/heads/main.zip
