# Entorno de MonitorEO en Python: el paquete monitoreo de GitHub (que `monitoreo mcp` mantiene en su última versión),
# con el servidor MCP, las gráficas y las pruebas.
# Créalo con Miniforge (solo conda-forge, sin las condiciones de uso del canal defaults de Anaconda):
#   conda env create -f environment.yml
#   conda activate monitoreo
#   earthengine authenticate
name: monitoreo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - earthengine-api>=1.0
  - numpy
  - pyyaml             # recetas de variables (monitoreo download)
  - gdal>=3.6          # lectura de vectores y escritura de GeoTIFF (opcional para las series temporales)
  - matplotlib         # gráficas de las series temporales
  - mcp>=1.10          # servidor MCP
  - pytest
  - pip
  - pip:
      - monitoreo[mcp,plot] @ https://github.com/monitoreo-obsnev/monitoreo/archive/refs/heads/main.zip
