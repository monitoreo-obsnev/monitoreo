name: add-ndmi-variable
expected_outcome: |
  Works on a new branch from origin/main. Notices that the catalog already has LSWI of Sentinel-2 (ref 4) with exactly
  the formula asked for, (B8 - B11) / (B8 + B11), tells the developer before building anything and proposes what to do
  (an alias, the name NDMI in the help of the tools or in the wiki, or nothing), then waits for their choice, as the
  skill says. Whatever it prepares keeps the rules of the team (a branch, references with a verified DOI, UDUNITS
  units, tests, the help of the tools, the wiki in Spanish and English on a wiki branch that waits for the merge), and
  nothing is pushed, tagged or opened as a pull request.
